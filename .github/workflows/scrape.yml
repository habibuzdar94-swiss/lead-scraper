name: Scrape Realtor.com property listings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  push:
    paths:
      - "scraper.py"
      - "test_scraper.py"
      - "requirements.txt"
      - "urls.txt"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

concurrency:
  group: realtor-property-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run scraper
        env:
          MAX_SEEDS: ${{ vars.MAX_SEEDS || '60' }}
          MAX_PAGES_PER_SEED: ${{ vars.MAX_PAGES_PER_SEED || '5' }}
          MAX_TOTAL_PAGES: ${{ vars.MAX_TOTAL_PAGES || '200' }}
          MAX_LISTINGS: ${{ vars.MAX_LISTINGS || '5000' }}
          REQUEST_DELAY: ${{ vars.REQUEST_DELAY || '2' }}
          LOG_LEVEL: INFO
        run: python scraper.py
      - name: Upload CSV and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtor-listings-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/listings.csv output/listings.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Realtor.com listings [skip ci]"
            git push
          fi
